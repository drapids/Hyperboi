<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Builderballin</title>
<meta name="description" content="Build custom maps for Hyperballin and play them in game with Hyperboi.">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
</head>
<body>
<div class="app" id="app">
  <header class="bar" data-enter>
    <div class="brand">
      <svg viewBox="0 0 32 32" class="brand-mark" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="#1c3faa"/><circle cx="16" cy="16" r="10.5" fill="none" stroke="#fff" stroke-width="1.6"/><path d="M16 5.5v21M5.5 16h21M8.6 8.6l14.8 14.8M23.4 8.6L8.6 23.4" stroke="#fff" stroke-width="1.2"/><circle cx="16" cy="16" r="3.2" fill="#fff"/></svg>
      <span class="brand-name">Builderballin</span>
    </div>
    <input id="mapName" class="mapname" spellcheck="false" aria-label="Map name">
    <div class="bar-group">
      <button class="icon-btn" id="undoBtn" title="Undo (Ctrl+Z)" aria-label="Undo"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg></button>
      <button class="icon-btn" id="redoBtn" title="Redo (Ctrl+Shift+Z)" aria-label="Redo"><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 000 12h3"/></svg></button>
    </div>
    <div class="seg" id="toolSeg" role="radiogroup" aria-label="Tool">
      <button data-tool="select" title="Select (V)">Select</button>
      <button data-tool="translate" title="Move (W)">Move</button>
      <button data-tool="rotate" title="Rotate (E)">Rotate</button>
      <button data-tool="scale" title="Scale (R)">Scale</button>
      <span class="seg-thumb"></span>
    </div>
    <div class="spacer"></div>
    <button class="btn ghost" id="helpBtn">Shortcuts</button>
    <button class="btn ghost" id="newBtn">New</button>
    <button class="btn ghost" id="openBtn">Open</button>
    <button class="btn ghost" id="settingsBtn">Map settings</button>
    <button class="btn primary" id="exportBtn">Export map</button>
    <input type="file" id="fileInput" accept=".hbmap,.json,application/json" hidden>
  </header>

  <aside class="tray" data-enter>
    <div class="cats" id="cats" role="tablist"></div>
    <div class="search"><input id="pieceSearch" placeholder="Find a piece" aria-label="Find a piece"></div>
    <div class="pieces" id="pieces"></div>
    <p class="tray-note" id="trayNote"></p>
  </aside>

  <main class="stage" id="stage">
    <canvas id="view"></canvas>
    <div class="viewbar" data-enter>
      <button data-view="persp" class="on">3D</button>
      <button data-view="top">Top</button>
      <button data-view="side">Side</button>
      <button data-view="frame" title="Frame everything (F with nothing selected)">Frame all</button>
    </div>
    <div class="placing" id="placing" hidden>
      <span class="placing-name" id="placingName"></span>
      <span class="placing-help">Click to place, drag to paint a row. Scroll while holding Alt to change height. Esc stops.</span>
      <span class="placing-height" id="placingHeight"></span>
    </div>
    <div class="marquee" id="marquee" hidden></div>
    <div class="drop" id="drop" hidden><div>Drop a map file to open it</div></div>
  </main>

  <aside class="inspector" id="inspector" data-enter></aside>

  <footer class="timeline" data-enter>
    <button class="play" id="playBtn" aria-label="Play motion preview" title="Play motion (Space)"><svg viewBox="0 0 24 24" id="playIcon"><path d="M7 4.5v15l12-7.5z"/></svg></button>
    <div class="time" id="timeText">0.0 s</div>
    <input type="range" class="scrub" id="scrub" min="0" max="12" step="0.01" value="0" aria-label="Preview time">
    <label class="mini-toggle" title="Show triggered motion as if its trigger already fired"><input type="checkbox" id="fireTriggers"> Triggers fired</label>
    <div class="divider"></div>
    <label class="mini-select">Grid <select id="gridSel"><option value="25">25 cm</option><option value="50">50 cm</option><option value="100" selected>1 m</option><option value="200">2 m</option><option value="400">4 m</option></select></label>
    <label class="mini-select">Angle <select id="angleSel"><option value="0">Free</option><option value="5">5°</option><option value="15" selected>15°</option><option value="45">45°</option><option value="90">90°</option></select></label>
    <label class="mini-toggle"><input type="checkbox" id="snapChk" checked> Snap</label>
    <div class="divider"></div>
    <div class="stat" id="statText"></div>
    <div class="saved" id="savedText"></div>
  </footer>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>
<div id="modalRoot"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
