<body class="p-2">
<div class="board rounded-xl h-[102px] flex items-center gap-4 px-4">
  <div class="marble w-9 h-9 shrink-0"></div>
  <div class="shrink-0">
    <div class="flex items-baseline gap-1.5">
      <div id="spd" class="dot text-5xl leading-none">000</div>

    <div id="tmr" class="dot text-base h-5 mt-1"></div>

  <div class="flex-1 flex flex-wrap gap-1 justify-end content-center max-h-[86px] overflow-hidden" id="act"></div>
  <div id="dot" class="absolute top-4 right-4 w-2 h-2 rounded-full bg-rose"></div>
